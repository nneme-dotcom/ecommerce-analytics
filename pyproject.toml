[project]
name = "ecommerce-analytics"
version = "0.1.0"
description = "Marketplace intelligence: Olist business analytics + Mercado Libre price intelligence"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]  # S = bandit security checks

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and obviously fake token literals

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # import `ingestion` without installing the project
