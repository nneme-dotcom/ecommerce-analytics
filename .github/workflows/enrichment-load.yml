name: Enrichment load (manual)

# Live end-to-end check of task 1.5: fetches ECB FX rates (Frankfurter v1) and public holidays
# (Nager.Date v4) and loads them into a throwaway PostgreSQL service with the real loaders.
# The agents' workspace cannot reach these APIs; GitHub runners can. Manual only, no schedule yet.
# Both sources are public, unauthenticated data: no secrets are used. The fetched rows are
# uploaded as an artifact (CSV) for inspection; there is no persistent warehouse yet.

on:
  workflow_dispatch:
    inputs:
      fx_start:
        description: "First FX date (YYYY-MM-DD)"
        default: "2016-09-01"
        required: true

permissions:
  contents: read

concurrency:
  group: enrichment-load-${{ github.ref }}
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Load FX rates
        env:
          FX_START: ${{ inputs.fx_start }}
        run: |
          mkdir -p out
          python -m ingestion.enrichment.fx_rates --start "$FX_START" --csv-out out/fx_rates.csv
      - name: Load public holidays
        if: ${{ !cancelled() }}
        run: |
          mkdir -p out
          python -m ingestion.enrichment.holidays --csv-out out/public_holidays.csv
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### raw_enrichment row counts"
            echo '```'
            psql "$DATABASE_URL" -c "SELECT quote_currency, count(*) AS days, min(rate_date) AS first, max(rate_date) AS last FROM raw_enrichment.fx_rates GROUP BY 1 ORDER BY 1" \
              || echo "fx_rates: not loaded"
            psql "$DATABASE_URL" -c "SELECT country_code, extract(year FROM holiday_date)::int AS year, count(*) AS entries, count(*) FILTER (WHERE 'Public' = ANY(holiday_types)) AS public FROM raw_enrichment.public_holidays GROUP BY 1, 2 ORDER BY 1, 2" \
              || echo "public_holidays: not loaded"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload fetched rows
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: enrichment-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
