name: Check secrets

# Manual check that the secrets used by the daily snapshot are present and usable.
# Never prints secret values and never spends ML_REFRESH_TOKEN (single-use, rotates).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # Don't keep GITHUB_TOKEN as a git auth header: it would shadow the PAT in the push probe.
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check secrets
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          DATA_REPO_PAT: ${{ secrets.DATA_REPO_PAT }}
        run: python scripts/check_secrets.py
